name: Deploy to Firebase Hosting on PR
on: pull_request
permissions:
  checks: write
  contents: read
  pull-requests: write
jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'
      - run: yarn install --frozen-lockfile
      - run: yarn lint
      - run: yarn build
      # Dependabot-triggered runs get GitHub's separate Dependabot secret store,
      # so the service account secret is empty and the deploy action hard-fails.
      # Lint and build above are what matter for a dependency bump anyway.
      #
      # This keys off github.actor, the actor that triggered the run, rather than
      # the pull request author: which secret store a run gets depends on who
      # triggered it, not on who opened the pull request. Once a human pushes to
      # a Dependabot branch the real secret is available, and skipping the
      # preview there would deny a review of exactly the commits a person wrote.
      # github.actor is deliberate over github.triggering_actor: on a manual
      # re-run of a Dependabot run the former stays dependabot[bot] while the
      # latter becomes the human, and such a re-run still gets Dependabot's
      # secrets, so github.actor is the one that keeps the step skipped.
      - if: ${{ github.actor != 'dependabot[bot]' }}
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BARKOCHBA_APP }}
          projectId: barkochba-app
